# CloudFormation GitSync deployment file.
# Reference: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/git-sync.html
#
# In the AWS Console: CloudFormation -> Create stack -> Sync from Git
# Point CodeConnections at this repo, branch "main", and select this file
# as the deployment configuration.

template-file-path: template.yaml

parameters:
  ProjectName: webtier
  VpcCidr: 10.0.0.0/16
  PublicSubnet1Cidr: 10.0.1.0/24
  PublicSubnet2Cidr: 10.0.2.0/24
  PrivateSubnet1Cidr: 10.0.11.0/24
  PrivateSubnet2Cidr: 10.0.12.0/24
  InstanceType: t3.micro
  CpuScaleOutThreshold: "30"

tags:
  Project: webtier
  ManagedBy: cloudformation-gitsync
  Environment: lab